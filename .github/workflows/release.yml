name: Publish www static release

on:
  push:
    tags: ["www-v*"]

permissions: {contents: read}

concurrency:
  group: pages-www-${{ github.ref_name }}
  cancel-in-progress: false

env:
  MAX_ASSET_BYTES: 104857600
  MAX_TAR_BYTES: 134217728
  GIT_CONFIG_NOSYSTEM: "1"
  GIT_CONFIG_SYSTEM: /dev/null
  GIT_CONFIG_GLOBAL: /tmp/telecrypt-gitconfig
  GIT_CONFIG_COUNT: "0"
  GIT_CONFIG_PARAMETERS: ""
  GIT_NO_REPLACE_OBJECTS: "1"
  GIT_TERMINAL_PROMPT: "0"
  GIT_ASKPASS: /bin/false
  SSH_ASKPASS: /bin/false
  GIT_ALLOW_PROTOCOL: https
  GIT_PROTOCOL_FROM_USER: "0"
  GH_HOST: github.com
  HTTP_PROXY: ""
  HTTPS_PROXY: ""
  ALL_PROXY: ""
  NO_PROXY: ""

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions: {contents: read}
    outputs:
      artifact_size: ${{ steps.package.outputs.artifact_size }}
      artifact_digest: ${{ steps.package.outputs.artifact_digest }}
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Verify exact annotated source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^www-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          repo_url="https://github.com/${GITHUB_REPOSITORY}.git"
          config_file="$RUNNER_TEMP/git-local-config"
          set +e
          git config --local --no-includes --name-only --get-regexp '^(include|includeif|url\..*\.(insteadof|pushinsteadof)|credential(\..*)?|http(\..*)?|remote\..*\.(proxy|uploadpack|receivepack|pushurl)|core\.(sshcommand|gitproxy)|ssh\..*)$' >"$config_file"
          config_status="$?"
          set -e
          test "$config_status" = 0 -o "$config_status" = 1
          while IFS= read -r key; do
            test -z "$key" || git config --local --no-includes --unset-all "$key" >/dev/null 2>&1 || true
          done <"$config_file"
          rm -f "$config_file"
          git remote set-url origin "$repo_url"
          test "$(git remote get-url origin)" = "$repo_url"
          d="$(mktemp -d)"
          set +e
          python3 scripts/bounded-command.py --stdout "$d/out" --stderr "$d/err" --max-stdout-bytes 65536 --max-stderr-bytes 65536 --timeout-seconds 60 --kill-after-seconds 5 -- git -c protocol.file.allow=never -c protocol.ext.allow=never -c protocol.ssh.allow=never -c credential.helper= -c core.askPass=/bin/false -c http.proxy= -c https.proxy= -c http.sslVerify=true fetch --force --no-tags --quiet "$repo_url" "refs/tags/$RELEASE_TAG:refs/remotes/origin/release-tag" refs/heads/main:refs/remotes/origin/main
          status="$?"
          set -e
          test "$status" = 0
          test "$(wc -c <"$d/out")" -le 65536 -a "$(wc -c <"$d/err")" -le 65536
          test ! -s "$d/out" -a ! -s "$d/err"
          test "$(git cat-file -t refs/remotes/origin/release-tag)" = tag
          release_commit="$(git rev-parse 'refs/remotes/origin/release-tag^{commit}')"
          test "$release_commit" = "$RELEASE_SHA"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$release_commit" = "$(git rev-parse refs/remotes/origin/main)"
          git merge-base --is-ancestor "$release_commit" refs/remotes/origin/main
          rm -rf "$d"
      - name: Test and build the static site
        uses: pnpm/setup@v2.0.2
        timeout-minutes: 10
        with: {version: 11.22.0, runtime: node@22.23.2, cache: false, install: false}
      - name: Verify exact site version
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = v22.23.2
          test "$(pnpm --version)" = 11.22.0
          test "${RELEASE_TAG#www-v}" = "$(node -p 'require("./package.json").version')"
          test "$(head -n 1 LICENSE)" = "MIT License"
      - name: Install, test, and build the exact site
        shell: bash
        run: |
          set -euo pipefail
          bounded_command() {
            local output="$1" seconds="$2" status error
            shift 2
            error="$output.err"
            set +e
            python3 scripts/bounded-command.py --stdout "$output" --stderr "$error" --max-stdout-bytes 1048576 --max-stderr-bytes 524288 --timeout-seconds "$seconds" --kill-after-seconds 5 -- "$@"
            status="$?"
            set -e
            test "$(wc -c <"$output")" -le 1048576 -a "$(wc -c <"$error")" -le 524288
            test "$status" = 0
            test ! -s "$error"
            ! grep -Eqi '(^|[^[:alnum:]_])warn(ing)?([^[:alnum:]_]|$)' "$output" "$error"
          }
          bounded_command "$RUNNER_TEMP/pnpm-install.out" 600 pnpm --reporter=append-only install --frozen-lockfile --ignore-scripts
          bounded_command "$RUNNER_TEMP/pnpm-lint.out" 300 pnpm --reporter=append-only run lint
          bounded_command "$RUNNER_TEMP/pnpm-build.out" 600 pnpm --reporter=append-only run build
          bounded_command "$RUNNER_TEMP/pnpm-generated-site-validate.out" 300 python3 scripts/validate-generated-site.py dist
      - name: Package the exact tested artifact
        id: package
        shell: bash
        run: |
          set -euo pipefail
          bounded_local() {
            local output="$1" seconds="$2" status error
            shift 2
            error="$output.err"
            set +e
            python3 scripts/bounded-command.py --stdout "$output" --stderr "$error" --max-stdout-bytes 131072 --max-stderr-bytes 131072 --timeout-seconds "$seconds" --kill-after-seconds 5 -- "$@"
            status="$?"
            set -e
            test "$(wc -c <"$output")" -le 65536 -a "$(wc -c <"$error")" -le 65536
            test "$status" = 0
            test ! -s "$error"
            ! grep -Eqi '(^|[^[:alnum:]_])warn(ing)?([^[:alnum:]_]|$)' "$output" "$error"
          }
          d="$RUNNER_TEMP/www-release"
          mkdir -p "$d"
          archive="${RELEASE_TAG}.tar.gz"
          bounded_local "$d/tar.out" 300 tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner --format=posix --pax-option=atime:=0,ctime:=0 --create --file "$d/${RELEASE_TAG}.tar" --directory dist .
          test "$(wc -c <"$d/${RELEASE_TAG}.tar")" -le "$MAX_TAR_BYTES"
          bounded_local "$d/gzip.out" 300 bash -c 'gzip --no-name --stdout "$1" >"$2"' _ "$d/${RELEASE_TAG}.tar" "$d/$archive"
          rm -f "$d/${RELEASE_TAG}.tar"
          bounded_local "$d/validate.out" 300 python3 scripts/validate-pages-artifact.py "$d/$archive"
          size="$(wc -c <"$d/$archive")"
          test "$size" -gt 0 -a "$size" -le "$MAX_ASSET_BYTES"
          printf 'artifact_size=%s\nartifact_digest=sha256:%s\n' "$size" "$(sha256sum "$d/$archive" | awk '{print $1}')" >>"$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: www-release-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ${{ runner.temp }}/www-release/${{ github.ref_name }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions: {contents: write}
    outputs:
      release_id: ${{ steps.publish.outputs.release_id }}
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_SHA: ${{ github.sha }}
      EXPECTED_SIZE: ${{ needs.build.outputs.artifact_size }}
      EXPECTED_DIGEST: ${{ needs.build.outputs.artifact_digest }}
    steps:
      - uses: actions/checkout@v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/download-artifact@v8.0.1
        with:
          name: www-release-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: release
      - name: Create or reuse the exact draft Release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^www-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          repo_url="https://github.com/${GITHUB_REPOSITORY}.git"
          config_file="$RUNNER_TEMP/git-local-config"
          set +e
          git config --local --no-includes --name-only --get-regexp '^(include|includeif|url\..*\.(insteadof|pushinsteadof)|credential(\..*)?|http(\..*)?|remote\..*\.(proxy|uploadpack|receivepack|pushurl)|core\.(sshcommand|gitproxy)|ssh\..*)$' >"$config_file"
          config_status="$?"
          set -e
          test "$config_status" = 0 -o "$config_status" = 1
          while IFS= read -r key; do
            test -z "$key" || git config --local --no-includes --unset-all "$key" >/dev/null 2>&1 || true
          done <"$config_file"
          rm -f "$config_file"
          git remote set-url origin "$repo_url"
          test "$(git remote get-url origin)" = "$repo_url"
          verify_source() {
            local d status release_commit
            d="$(mktemp -d)"
            set +e
            python3 scripts/bounded-command.py --stdout "$d/out" --stderr "$d/err" --max-stdout-bytes 65536 --max-stderr-bytes 65536 --timeout-seconds 60 --kill-after-seconds 5 -- git -c protocol.file.allow=never -c protocol.ext.allow=never -c protocol.ssh.allow=never -c credential.helper= -c core.askPass=/bin/false -c http.proxy= -c https.proxy= -c http.sslVerify=true fetch --force --no-tags --quiet "$repo_url" "refs/tags/$RELEASE_TAG:refs/remotes/origin/release-tag" refs/heads/main:refs/remotes/origin/main
            status="$?"
            set -e
            test "$status" = 0
            test "$(wc -c <"$d/out")" -le 65536 -a "$(wc -c <"$d/err")" -le 65536
            test ! -s "$d/out" -a ! -s "$d/err"
            test "$(git cat-file -t refs/remotes/origin/release-tag)" = tag
            release_commit="$(git rev-parse 'refs/remotes/origin/release-tag^{commit}')"
            test "$release_commit" = "$RELEASE_SHA"
            test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
            test "$release_commit" = "$(git rev-parse refs/remotes/origin/main)"
            git merge-base --is-ancestor "$release_commit" refs/remotes/origin/main
            rm -rf "$d"
          }
          verify_source
          archive="release/${RELEASE_TAG}.tar.gz"
          test -f "$archive"
          test "$(wc -c <"$archive")" = "$EXPECTED_SIZE"
          test "sha256:$(sha256sum "$archive" | awk '{print $1}')" = "$EXPECTED_DIGEST"
          bounded_local "$RUNNER_TEMP/www-release-archive-validate.out" 300 python3 scripts/validate-pages-artifact.py "$archive"
          asset_name="${RELEASE_TAG}.tar.gz"
          bounded_gh() {
            local output="$1" error status
            shift
            error="$output.err"
            set +e
            python3 scripts/bounded-command.py --stdout "$output" --stderr "$error" --max-stdout-bytes 131072 --max-stderr-bytes 131072 --timeout-seconds 120 --kill-after-seconds 5 -- gh "$@"
            status="$?"
            set -e
            test "$(wc -c <"$output")" -le 131072 -a "$(wc -c <"$error")" -le 131072
            if test "$status" = 0; then test ! -s "$error"; fi
            return "$status"
          }
          bounded_local() {
            local output="$1" seconds="$2" status error
            shift 2
            error="$output.err"
            set +e
            python3 scripts/bounded-command.py --stdout "$output" --stderr "$error" --max-stdout-bytes 131072 --max-stderr-bytes 131072 --timeout-seconds "$seconds" --kill-after-seconds 5 -- "$@"
            status="$?"
            set -e
            test "$(wc -c <"$output")" -le 65536 -a "$(wc -c <"$error")" -le 65536
            test "$status" = 0
            test ! -s "$error"
            ! grep -Eqi '(^|[^[:alnum:]_])warn(ing)?([^[:alnum:]_]|$)' "$output" "$error"
          }
          verify_draft() {
            python3 scripts/verify-release.py --json "$1" --tag "$RELEASE_TAG" --asset-name "$asset_name" --expected-target-commit "$RELEASE_SHA" --state draft --max-asset-bytes "$MAX_ASSET_BYTES" --expected-release-id "$2" >/dev/null
          }
          revalidate_draft_for_publish() {
            local json="$1" id="$2"
            bounded_gh "$json" api --hostname github.com --header 'X-GitHub-Api-Version: 2026-03-10' "/repos/$GITHUB_REPOSITORY/releases/$id"
            verify_draft "$json" "$id"
            test "$(jq -c '[.assets[] | {id,name,state,size,digest}] | sort_by(.name)' "$json")" = "$expected_draft_asset_metadata"
            python3 scripts/verify-release.py --json "$json" --tag "$RELEASE_TAG" --asset-name "$asset_name" --expected-target-commit "$RELEASE_SHA" --state draft --max-asset-bytes "$MAX_ASSET_BYTES" --artifact "$archive" --expected-release-id "$id" >/dev/null
          }
          verify_published() {
            python3 scripts/verify-release.py --json "$1" --tag "$RELEASE_TAG" --asset-name "$asset_name" --expected-target-commit "$RELEASE_SHA" --state published --max-asset-bytes "$MAX_ASSET_BYTES" --expected-release-id "$2"
          }
          download_asset() {
            local json="$1" output="$2" asset_id error status
            asset_id="$(jq -er '.assets[0].id | select(type=="number" and .>0 and floor==.)' "$json")"
            error="$output.err"
            set +e
            python3 scripts/bounded-command.py --stdout "$output.stdout" --stderr "$error" --max-stdout-bytes 131072 --max-stderr-bytes 131072 --timeout-seconds 120 --kill-after-seconds 5 -- gh api --hostname github.com --header 'X-GitHub-Api-Version: 2026-03-10' --header 'Accept: application/octet-stream' --output "$output" "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
            status="$?"
            set -e
            test "$status" = 0
            test "$(wc -c <"$error")" -le 131072 -a ! -s "$error" -a ! -s "$output.stdout"
            test "$(wc -c <"$output")" = "$EXPECTED_SIZE"
            test "sha256:$(sha256sum "$output" | awk '{print $1}')" = "$EXPECTED_DIGEST"
            cmp -s "$archive" "$output"
            bounded_local "$output.validation" 300 python3 scripts/validate-pages-artifact.py "$output"
          }
          probe="$RUNNER_TEMP/release-probe.json"
          set +e
          bounded_gh "$probe" api --hostname github.com --header 'X-GitHub-Api-Version: 2026-03-10' "/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG"
          probe_status="$?"
          set -e
          if test "$probe_status" != 0; then
            test ! -s "$probe"
            test -s "$probe.err"
            test "$(wc -c <"$probe.err")" -le 131072
            status_probe="$RUNNER_TEMP/release-status"
            set +e
            bounded_gh "$status_probe" api --include --hostname github.com --header 'X-GitHub-Api-Version: 2026-03-10' "/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG"
            status_probe_exit="$?"
            set -e
            test "$status_probe_exit" != 0
            status_line="$(awk '/^HTTP\/[0-9.]+[[:space:]]/{print; exit}' "$status_probe")"
            [[ "$status_line" =~ ^HTTP/[0-9.]+[[:space:]]+404([[:space:]]|$) ]]
            create="$RUNNER_TEMP/release-create.json"
            verify_source
            bounded_gh "$create" api --hostname github.com --method POST --header 'X-GitHub-Api-Version: 2026-03-10' --raw-field "tag_name=$RELEASE_TAG" --raw-field "name=$RELEASE_TAG" --raw-field "body=Release $RELEASE_TAG" --raw-field "target_commitish=$RELEASE_SHA" --field draft=true --field prerelease=false "/repos/$GITHUB_REPOSITORY/releases"
            release_id="$(jq -er '.id | select(type=="number" and .>0 and floor==.)' "$create")"
            bounded_gh "$probe" api --hostname github.com --header 'X-GitHub-Api-Version: 2026-03-10' "/repos/$GITHUB_REPOSITORY/releases/$release_id"
          else
            release_id="$(jq -er '.id | select(type=="number" and .>0 and floor==.)' "$probe")"
          fi
          state="$(jq -er 'if .draft==true then "draft" elif .draft==false then "published" else empty end' "$probe")"
          case "$state" in
            draft)
              jq -e --arg tag "$RELEASE_TAG" --arg target "$RELEASE_SHA" 'def iso: type == "string" and test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$") and ((try fromdateiso8601 catch null) != null); (.tag_name==$tag and .name==$tag and .body==("Release "+$tag) and .target_commitish==$target and .draft==true and .prerelease==false and (.created_at|iso) and .published_at==null and ((.assets|type)=="array"))' "$probe" >/dev/null
              jq -e '((.assets|length) <= 64) and all(.assets[]; type == "object" and (.id|type == "number" and . > 0 and floor == .))' "$probe" >/dev/null
              asset_ids="$RUNNER_TEMP/release-assets"
              jq -r '.assets[]?.id // empty' "$probe" >"$asset_ids"
              while IFS= read -r asset_id; do
                test -z "$asset_id" || [[ "$asset_id" =~ ^[1-9][0-9]*$ ]]
                if test -n "$asset_id"; then
                  verify_source
                  bounded_gh "$RUNNER_TEMP/delete-$asset_id.json" api --hostname github.com --method DELETE --header 'X-GitHub-Api-Version: 2026-03-10' "/repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
                fi
              done <"$asset_ids"
              verify_source
              bounded_gh "$RUNNER_TEMP/upload.json" api --hostname github.com --method POST --header 'X-GitHub-Api-Version: 2026-03-10' --header 'Content-Type: application/gzip' --input "$archive" "/repos/$GITHUB_REPOSITORY/releases/$release_id/assets?name=$asset_name"
              bounded_gh "$probe" api --hostname github.com --header 'X-GitHub-Api-Version: 2026-03-10' "/repos/$GITHUB_REPOSITORY/releases/$release_id"
              verify_draft "$probe" "$release_id"
              python3 scripts/verify-release.py --json "$probe" --tag "$RELEASE_TAG" --asset-name "$asset_name" --expected-target-commit "$RELEASE_SHA" --state draft --max-asset-bytes "$MAX_ASSET_BYTES" --artifact "$archive" --expected-release-id "$release_id" >/dev/null
              expected_draft_asset_metadata="$(jq -c '[.assets[] | {id,name,state,size,digest}] | sort_by(.name)' "$probe")"
              download_asset "$probe" "$RUNNER_TEMP/draft.tar.gz"
              # Revalidate the authoritative tag and current main immediately before the one publish mutation.
              verify_source
              revalidate_draft_for_publish "$probe" "$release_id"
              bounded_gh "$RUNNER_TEMP/published.json" api --hostname github.com --method PATCH --header 'X-GitHub-Api-Version: 2026-03-10' --field draft=false "/repos/$GITHUB_REPOSITORY/releases/$release_id"
              bounded_gh "$probe" api --hostname github.com --header 'X-GitHub-Api-Version: 2026-03-10' "/repos/$GITHUB_REPOSITORY/releases/$release_id"
              verify_published "$probe" "$release_id" >/dev/null
              download_asset "$probe" "$RUNNER_TEMP/published.tar.gz"
              ;;
            published)
              # Only an exact immutable Release is recoverable on a rerun after downstream failure.
              test "${GITHUB_RUN_ATTEMPT:-1}" -gt 1
              verify_published "$probe" "$release_id" >/dev/null
              download_asset "$probe" "$RUNNER_TEMP/published.tar.gz"
              ;;
            *)
              echo "Release state is neither draft nor published" >&2
              exit 1
              ;;
          esac
          printf 'release_id=%s\n' "$release_id" >>"$GITHUB_OUTPUT"

  promote:
    needs: [build, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions: {contents: read, pages: write, id-token: write}
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_SHA: ${{ github.sha }}
      EXPECTED_RELEASE_ID: ${{ needs.release.outputs.release_id }}
      EXPECTED_SIZE: ${{ needs.build.outputs.artifact_size }}
      EXPECTED_DIGEST: ${{ needs.build.outputs.artifact_digest }}
    steps:
      - uses: actions/checkout@v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Download and verify the immutable Release artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          archive="${RELEASE_TAG}.tar.gz"
          json="$RUNNER_TEMP/release.json"
          error="$json.err"
          set +e
          python3 scripts/bounded-command.py --stdout "$json" --stderr "$error" --max-stdout-bytes 131072 --max-stderr-bytes 131072 --timeout-seconds 120 --kill-after-seconds 5 -- gh api --hostname github.com --header 'X-GitHub-Api-Version: 2026-03-10' "/repos/$GITHUB_REPOSITORY/releases/$EXPECTED_RELEASE_ID"
          status="$?"
          set -e
          test "$status" = 0
          test "$(wc -c <"$json")" -le 131072 -a "$(wc -c <"$error")" -le 131072 -a ! -s "$error"
          info="$(python3 scripts/verify-release.py --json "$json" --tag "$RELEASE_TAG" --asset-name "$archive" --expected-target-commit "$RELEASE_SHA" --state published --max-asset-bytes "$MAX_ASSET_BYTES" --expected-release-id "$EXPECTED_RELEASE_ID")"
          asset_id="$(jq -er '.asset_id | select(type=="number" and .>0 and floor==.)' <<<"$info")"
          downloaded="$RUNNER_TEMP/$archive"
          set +e
          python3 scripts/bounded-command.py --stdout "$downloaded.stdout" --stderr "$downloaded.err" --max-stdout-bytes 131072 --max-stderr-bytes 131072 --timeout-seconds 120 --kill-after-seconds 5 -- gh api --hostname github.com --header 'X-GitHub-Api-Version: 2026-03-10' --header 'Accept: application/octet-stream' --output "$downloaded" "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
          status="$?"
          set -e
          test "$status" = 0
          test "$(wc -c <"$downloaded.err")" -le 131072 -a ! -s "$downloaded.err" -a ! -s "$downloaded.stdout"
          test "$(wc -c <"$downloaded")" = "$EXPECTED_SIZE"
          test "sha256:$(sha256sum "$downloaded" | awk '{print $1}')" = "$EXPECTED_DIGEST"
          python3 scripts/verify-release.py --json "$json" --tag "$RELEASE_TAG" --asset-name "$archive" --expected-target-commit "$RELEASE_SHA" --state published --max-asset-bytes "$MAX_ASSET_BYTES" --artifact "$downloaded" --expected-release-id "$EXPECTED_RELEASE_ID" >/dev/null
          bounded_local() {
            local output="$1" seconds="$2" status error
            shift 2
            error="$output.err"
            set +e
            python3 scripts/bounded-command.py --stdout "$output" --stderr "$error" --max-stdout-bytes 131072 --max-stderr-bytes 131072 --timeout-seconds "$seconds" --kill-after-seconds 5 -- "$@"
            status="$?"
            set -e
            test "$(wc -c <"$output")" -le 65536 -a "$(wc -c <"$error")" -le 65536
            test "$status" = 0
            test ! -s "$error"
            ! grep -Eqi '(^|[^[:alnum:]_])warn(ing)?([^[:alnum:]_]|$)' "$output" "$error"
          }
          mkdir dist
          bounded_local "$RUNNER_TEMP/www-archive-extract.out" 300 tar --extract --gzip --file "$downloaded" --directory dist --no-overwrite-dir --no-same-owner --no-same-permissions
          bounded_local "$RUNNER_TEMP/www-generated-site-validate.out" 300 python3 scripts/validate-generated-site.py dist
      # Pages consumes only the verified immutable Release, and publication precedes this upload.
      - uses: actions/configure-pages@v6.0.0
      - name: Revalidate source before Pages upload
        shell: bash
        run: |
          set -euo pipefail
          repo_url="https://github.com/${GITHUB_REPOSITORY}.git"
          config_file="$RUNNER_TEMP/git-local-config"
          set +e
          git config --local --no-includes --name-only --get-regexp '^(include|includeif|url\..*\.(insteadof|pushinsteadof)|credential(\..*)?|http(\..*)?|remote\..*\.(proxy|uploadpack|receivepack|pushurl)|core\.(sshcommand|gitproxy)|ssh\..*)$' >"$config_file"
          config_status="$?"
          set -e
          test "$config_status" = 0 -o "$config_status" = 1
          while IFS= read -r key; do
            test -z "$key" || git config --local --no-includes --unset-all "$key" >/dev/null 2>&1 || true
          done <"$config_file"
          rm -f "$config_file"
          git remote set-url origin "$repo_url"
          test "$(git remote get-url origin)" = "$repo_url"
          d="$RUNNER_TEMP/pages-source-upload"
          mkdir -p "$d"
          set +e
          python3 scripts/bounded-command.py --stdout "$d/out" --stderr "$d/err" --max-stdout-bytes 65536 --max-stderr-bytes 65536 --timeout-seconds 60 --kill-after-seconds 5 -- git -c protocol.file.allow=never -c protocol.ext.allow=never -c protocol.ssh.allow=never -c credential.helper= -c core.askPass=/bin/false -c http.proxy= -c https.proxy= -c http.sslVerify=true fetch --force --no-tags --quiet "$repo_url" "refs/tags/$RELEASE_TAG:refs/remotes/origin/release-tag" refs/heads/main:refs/remotes/origin/main
          status="$?"
          set -e
          test "$status" = 0 -a "$(wc -c <"$d/out")" -le 65536 -a "$(wc -c <"$d/err")" -le 65536 -a ! -s "$d/out" -a ! -s "$d/err"
          test "$(git cat-file -t refs/remotes/origin/release-tag)" = tag
          release_commit="$(git rev-parse 'refs/remotes/origin/release-tag^{commit}')"
          test "$release_commit" = "$RELEASE_SHA" -a "$(git rev-parse HEAD)" = "$RELEASE_SHA" -a "$release_commit" = "$(git rev-parse refs/remotes/origin/main)"
          git merge-base --is-ancestor "$release_commit" refs/remotes/origin/main
      - uses: actions/upload-pages-artifact@v5.0.0
        with: {path: dist}

  deploy:
    needs: promote
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions: {contents: read, pages: write, id-token: write}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Revalidate source before Pages deployment
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          repo_url="https://github.com/${GITHUB_REPOSITORY}.git"
          config_file="$RUNNER_TEMP/git-local-config"
          set +e
          git config --local --no-includes --name-only --get-regexp '^(include|includeif|url\..*\.(insteadof|pushinsteadof)|credential(\..*)?|http(\..*)?|remote\..*\.(proxy|uploadpack|receivepack|pushurl)|core\.(sshcommand|gitproxy)|ssh\..*)$' >"$config_file"
          config_status="$?"
          set -e
          test "$config_status" = 0 -o "$config_status" = 1
          while IFS= read -r key; do
            test -z "$key" || git config --local --no-includes --unset-all "$key" >/dev/null 2>&1 || true
          done <"$config_file"
          rm -f "$config_file"
          git remote set-url origin "$repo_url"
          test "$(git remote get-url origin)" = "$repo_url"
          d="$RUNNER_TEMP/pages-source-deploy"
          mkdir -p "$d"
          set +e
          python3 scripts/bounded-command.py --stdout "$d/out" --stderr "$d/err" --max-stdout-bytes 65536 --max-stderr-bytes 65536 --timeout-seconds 60 --kill-after-seconds 5 -- git -c protocol.file.allow=never -c protocol.ext.allow=never -c protocol.ssh.allow=never -c credential.helper= -c core.askPass=/bin/false -c http.proxy= -c https.proxy= -c http.sslVerify=true fetch --force --no-tags --quiet "$repo_url" "refs/tags/$RELEASE_TAG:refs/remotes/origin/release-tag" refs/heads/main:refs/remotes/origin/main
          status="$?"
          set -e
          test "$status" = 0 -a "$(wc -c <"$d/out")" -le 65536 -a "$(wc -c <"$d/err")" -le 65536 -a ! -s "$d/out" -a ! -s "$d/err"
          test "$(git cat-file -t refs/remotes/origin/release-tag)" = tag
          release_commit="$(git rev-parse 'refs/remotes/origin/release-tag^{commit}')"
          test "$release_commit" = "$RELEASE_SHA" -a "$(git rev-parse HEAD)" = "$RELEASE_SHA" -a "$release_commit" = "$(git rev-parse refs/remotes/origin/main)"
          git merge-base --is-ancestor "$release_commit" refs/remotes/origin/main
      - id: deployment
        uses: actions/deploy-pages@v5.0.0
