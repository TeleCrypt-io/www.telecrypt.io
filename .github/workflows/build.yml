name: Deploy www site to GitHub Pages

# GitHub Pages serves the immutable release artifact at https://www.telecrypt.io/.
on:
  push:
    tags: ["www-v*"]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        env:
          GIT_CONFIG_COUNT: 2
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
          GIT_CONFIG_KEY_1: advice.detachedHead
          GIT_CONFIG_VALUE_1: "false"
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require an annotated immutable release tag
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^www-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          remote_tag_ref="refs/remotes/origin/release-tag"
          git fetch --force --no-tags origin \
            "refs/tags/$GITHUB_REF_NAME:$remote_tag_ref" \
            refs/heads/main:refs/remotes/origin/main
          test "$(git cat-file -t "$remote_tag_ref")" = tag
          release_commit="$(git rev-parse "$remote_tag_ref^{commit}")"
          main_commit="$(git rev-parse refs/remotes/origin/main)"
          test "$release_commit" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$release_commit" = "$main_commit"
          git merge-base --is-ancestor "$release_commit" refs/remotes/origin/main
          test "${GITHUB_REF_NAME#www-v}" = "$(node -p 'require("./package.json").version')"

      - uses: pnpm/setup@v2.0.2
        with:
          version: 11.19.0
          runtime: node@22.23.2
          cache: false
          install: false

      - uses: actions/configure-pages@v6.0.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run lint
      - run: pnpm build

      - name: Re-verify release identity and Pages artifact
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^www-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          remote_tag_ref="refs/remotes/origin/release-tag"
          git fetch --force --no-tags origin \
            "refs/tags/$GITHUB_REF_NAME:$remote_tag_ref" \
            refs/heads/main:refs/remotes/origin/main
          test "$(git cat-file -t "$remote_tag_ref")" = tag
          release_commit="$(git rev-parse "$remote_tag_ref^{commit}")"
          main_commit="$(git rev-parse refs/remotes/origin/main)"
          test "$release_commit" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$release_commit" = "$main_commit"
          git merge-base --is-ancestor "$release_commit" refs/remotes/origin/main
          test -s dist/CNAME
          test "$(cat dist/CNAME)" = "www.telecrypt.io"
          test -s dist/export/index.html
          test -s dist/export.txt
          test ! -e dist/eject/index.html
          test ! -e dist/eject.txt

      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Upstream DEP0040 warning: https://github.com/actions/deploy-pages/issues/434
      - id: deployment
        uses: actions/deploy-pages@v5.0.0
        env:
          NODE_OPTIONS: --no-deprecation
