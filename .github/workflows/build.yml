name: Deploy www site to GitHub Pages

# GitHub Pages serves the immutable release artifact at https://www.telecrypt.io/.
on:
  push:
    tags: ["www-v*"]

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Require an annotated immutable release tag
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^www-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = tag
          git fetch --force --no-tags origin refs/heads/main:refs/remotes/origin/main
          release_commit="$(git rev-parse "$GITHUB_REF_NAME^{commit}")"
          main_commit="$(git rev-parse refs/remotes/origin/main)"
          test "$release_commit" = "$main_commit"
          git merge-base --is-ancestor "$release_commit" refs/remotes/origin/main
          test "${GITHUB_REF_NAME#www-v}" = "$(node -p 'require("./package.json").version')"

      - uses: pnpm/setup@v2.0.2
        with:
          version: 11.19.0
          runtime: node@22.14.0
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          install: false

      - uses: actions/configure-pages@v6.0.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm build

      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.0
