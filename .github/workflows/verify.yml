name: Verify www site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.0.8

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 22.14.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      # `build` starts with `astro check`, then produces the static artifact.
      - run: pnpm run build
