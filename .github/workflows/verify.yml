name: Verify www site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/setup@v2.0.2
        with:
          version: 11.19.0
          runtime: node@22.14.0
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          install: false

      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      # `build` starts with `astro check`, then produces the static artifact.
      - run: pnpm run build
