name: Verify www site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.0.8

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 22.14.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # `build` starts with `astro check`, then produces the static artifact.
      # The repository's historical Biome warning backlog is deliberately not
      # made a new release blocker by this delivery-policy change.
      - run: pnpm run build
