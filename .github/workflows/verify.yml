name: Verify www site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        env:
          GIT_CONFIG_COUNT: 2
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
          GIT_CONFIG_KEY_1: advice.detachedHead
          GIT_CONFIG_VALUE_1: "false"
        with:
          persist-credentials: false

      - uses: pnpm/setup@v2.0.2
        with:
          version: 11.19.0
          runtime: node@22.23.2
          cache: false
          install: false

      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      # `build` starts with `astro check`, then produces the static artifact.
      - run: pnpm run build
